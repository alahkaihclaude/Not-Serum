name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Bundle
        run: cargo xtask bundle morphwave --release

      - name: Validate CLAP
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-windows.zip -OutFile cv.zip
          Expand-Archive cv.zip -DestinationPath cv
          $exe = (Get-ChildItem cv -Recurse -Filter clap-validator.exe | Select-Object -First 1).FullName
          & $exe validate --only-failed target/bundled/Morphwave.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render demos and benchmark
        shell: bash
        run: |
          mkdir renders
          for p in init supersaw pluck bass pad wobble; do cargo run -q --release --example render -- $p renders/$p.wav; done
          cargo run -q --release --example render -- bench

      - uses: actions/upload-artifact@v4
        with:
          name: Morphwave-windows
          path: target/bundled/*

      - uses: actions/upload-artifact@v4
        with:
          name: Morphwave-demo-renders
          path: renders/*.wav
