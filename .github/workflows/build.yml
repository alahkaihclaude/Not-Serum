name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # lets tag builds publish a GitHub Release

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test

      - name: Get clap-validator
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-windows.zip -OutFile cv.zip
          Expand-Archive cv.zip -DestinationPath cv
          Copy-Item (Get-ChildItem cv -Recurse -Filter clap-validator.exe | Select-Object -First 1).FullName clap-validator.exe

      # Debug builds abort if anything allocates on the audio thread (nih-plug's assert_process_allocs),
      # so fuzzing a debug build catches real-time-safety bugs the release build would hide.
      - name: Validate debug build (audio-thread allocation check)
        shell: pwsh
        run: |
          cargo xtask bundle morphwave
          ./clap-validator.exe validate --only-failed target/bundled/Morphwave.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bundle release
        run: cargo xtask bundle morphwave --release

      - name: Validate release build
        shell: pwsh
        run: |
          ./clap-validator.exe validate --only-failed target/bundled/Morphwave.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Render demos and benchmark
        shell: bash
        run: |
          mkdir renders
          for p in init supersaw pluck bass pad wobble; do cargo run -q --release --example render -- $p renders/$p.wav; done
          cargo run -q --release --example render -- bench

      - uses: actions/upload-artifact@v4
        with:
          name: Morphwave-windows
          path: target/bundled/*

      - uses: actions/upload-artifact@v4
        with:
          name: Morphwave-demo-renders
          path: renders/*.wav

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "Morphwave-$env:GITHUB_REF_NAME-windows.zip"
          Compress-Archive -Path target/bundled/Morphwave.clap, README.md, THIRD_PARTY.md -DestinationPath $zip
          gh release create $env:GITHUB_REF_NAME $zip --title "Morphwave $env:GITHUB_REF_NAME" --notes "Windows x64 CLAP plugin. Unzip and copy Morphwave.clap to C:\Program Files\Common Files\CLAP, then rescan plugins in FL Studio. See README.md for the manual."
