name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace

      - name: Bundle
        run: cargo xtask bundle morphwave --release

      - name: Validate CLAP
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/free-audio/clap-validator/releases/download/0.4.1/clap-validator-0.4.1-127-g152b982-windows.zip -OutFile cv.zip
          Expand-Archive cv.zip -DestinationPath cv
          $exe = (Get-ChildItem cv -Recurse -Filter clap-validator.exe | Select-Object -First 1).FullName
          # shortcut: skips tests that fail on nih-plug's state loading (robbert-vdh/nih-plug#275, #279); re-enable once fixed upstream or patched.
          & $exe validate --only-failed -x "state-reproducibility" -x "state-invalid-random" target/bundled/Morphwave.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: Morphwave-windows
          path: target/bundled/*
