[workspace]
members = ["xtask"]

[package]
name = "morphwave"
version = "1.0.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
base64 = "0.22"
crossbeam-queue = "0.3"
hound = "3"
miniz_oxide = "0.8"
# default-features = false drops the `vst3` feature, which pulls in GPLv3 vst3-sys (see README "Licensing").
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["assert_process_allocs"] }
nih_plug_egui = { path = "vendor/nih_plug_egui" }  # vendored with a resize fix, see vendor/nih_plug_egui/PATCHES.md
realfft = "3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Documents folder lookup (handles OneDrive-redirected Documents)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Foundation"] }

[profile.release]
lto = "thin"
strip = "symbols"

[dev-dependencies]
# dev-only: `cargo run --example standalone` opens the GUI without a DAW (not shipped)
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", default-features = false, features = ["standalone"] }

# Vendored nih-plug core with two state-loading fixes (see vendor/nih-plug/PATCHES.md).
[patch."https://github.com/robbert-vdh/nih-plug.git"]
nih_plug = { path = "vendor/nih-plug" }

# Vendored egui-baseview that forwards file drag-and-drop (see vendor/egui-baseview/PATCHES.md).
[patch."https://github.com/BillyDM/egui-baseview.git"]
egui-baseview = { path = "vendor/egui-baseview" }
